<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Veyru Keyolhu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Login -->
<main class="login" id="loginView" hidden>
  <form class="login__card" id="loginForm">
    <h1>Veyru Keyolhu</h1>
    <p>Admin sign in</p>
    <label>Password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button class="btn" type="submit">Sign in</button>
    <p class="login__error" id="loginError" role="alert"></p>
  </form>
</main>

<!-- Editor -->
<div id="editorView" hidden>
  <header class="bar">
    <strong>Veyru Keyolhu <span>Admin</span></strong>
    <div class="bar__actions">
      <a href="/" target="_blank" rel="noopener" class="link">View site ↗</a>
      <button class="link" id="logoutBtn">Log out</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="tours" class="is-active">Tours</button>
    <button data-tab="stays">Staying</button>
    <button data-tab="gallery">Gallery</button>
    <button data-tab="home">Home page</button>
    <button data-tab="about">About</button>
    <button data-tab="contact">Contact</button>
  </nav>

  <main class="panel" id="panel"></main>

  <footer class="savebar" id="savebar">
    <span id="saveStatus">All changes saved</span>
    <button class="btn" id="saveBtn" disabled>Save changes</button>
  </footer>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="admin.js"></script>
</body>
</html>
